name: Build plugin zip and publish Release

on:
  push:
    tags:
      - '*-*.*.*'

jobs:
  build:
    name: Zip & release plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Extrai "id" e "versao" do nome da tag.
      # Aceita tanto "<id>-X.Y.Z" quanto "v<id>-X.Y.Z" (defensivo).
      - name: Parse tag (id, version)
        id: parse
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # tira prefixo 'v' se existir
          TAG="${TAG#v}"
          if [[ ! "$TAG" =~ ^([A-Za-z0-9._-]+)-([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag invalida: $TAG (esperado: <id>-X.Y.Z)" >&2
            exit 1
          fi
          PLUGIN_ID="${BASH_REMATCH[1]}"
          PLUGIN_VERSION="${BASH_REMATCH[2]}"
          echo "plugin_id=$PLUGIN_ID"     >> "$GITHUB_OUTPUT"
          echo "plugin_version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "Tag parseada: id=$PLUGIN_ID version=$PLUGIN_VERSION"

      - name: Verify plugin folder exists
        shell: bash
        run: |
          ID="${{ steps.parse.outputs.plugin_id }}"
          if [ ! -d "plugins/$ID" ]; then
            echo "Pasta do plugin nao encontrada: plugins/$ID" >&2
            exit 1
          fi
          if [ ! -f "plugins/$ID/plugin.json" ]; then
            echo "plugin.json nao encontrado em plugins/$ID" >&2
            exit 1
          fi
          # Verifica o entrypoint declarado em plugin.json (pode ser main.py, main.js, etc.)
          ENTRY=$(python3 -c "import json; d=json.load(open('plugins/$ID/plugin.json', encoding='utf-8')); print(d.get('entry','main.py'))")
          if [ ! -f "plugins/$ID/$ENTRY" ]; then
            echo "Entrypoint '$ENTRY' nao encontrado em plugins/$ID" >&2
            echo "(declarado em plugin.json -> entry)" >&2
            exit 1
          fi
          echo "Verificacao OK: plugins/$ID/$ENTRY encontrado"

      # Sincroniza o plugin.json versionado do commit da tag
      # (a tag aponta para o commit do release; esta etapa garante
      # que o version dentro do zip bate com a tag)
      - name: Sync plugin.json version with tag
        shell: bash
        run: |
          ID="${{ steps.parse.outputs.plugin_id }}"
          VER="${{ steps.parse.outputs.plugin_version }}"
          PJ="plugins/$ID/plugin.json"
          python3 - "$PJ" "$VER" <<'PY'
          import json, sys
          pj, ver = sys.argv[1], sys.argv[2]
          with open(pj, encoding="utf-8") as f:
              data = json.load(f)
          data["version"] = ver
          with open(pj, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print(f"plugin.json version -> {ver}")
          PY

      # Empacota os arquivos do plugin com layout de raiz:
      # ao descompactar, plugin.json e main.py ficam direto na raiz (sem subpasta).
      # Exclui __pycache__ e arquivos .pyc gerados localmente.
      - name: Build plugin zip (root layout)
        shell: bash
        run: |
          ID="${{ steps.parse.outputs.plugin_id }}"
          TMP="$(mktemp -d)"
          # copia os arquivos do plugin para um diretorio temporario
          cp -r "plugins/$ID/." "$TMP/"
          # remove artefatos locais que nao devem ir no zip
          find "$TMP" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find "$TMP" -name "*.pyc" -delete 2>/dev/null || true
          find "$TMP" -name "*.pyo" -delete 2>/dev/null || true
          # gera o zip sem subpasta: conteudo fica direto na raiz do zip
          (cd "$TMP" && zip -r "$ID.zip" . --exclude "*.zip" >/dev/null)
          mkdir -p dist
          mv "$TMP/$ID.zip" "dist/$ID.zip"
          echo "ZIP gerado: dist/$ID.zip"
          echo "Conteudo do ZIP:"
          unzip -l "dist/$ID.zip"

      - name: Upload zip as Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.parse.outputs.plugin_id }} v${{ steps.parse.outputs.plugin_version }}
          generate_release_notes: true
          files: |
            dist/${{ steps.parse.outputs.plugin_id }}.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
