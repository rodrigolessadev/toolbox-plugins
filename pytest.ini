[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    windows_only: Testes que exigem Windows nativo, DPAPI ou Windows Hello (pulados automaticamente em POSIX).
    optional_deps: Testes que exigem pacotes opcionais específicos (pynacl, pykeepass, cryptography).
    plugin(name): Marcador para associar o teste a um plugin específico.
filterwarnings =
    ignore::DeprecationWarning
