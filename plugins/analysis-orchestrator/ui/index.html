<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Analysis Orchestrator — Toolbox</title>
  <link rel="stylesheet" href="toolbox-theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1 class="header-title">Orquestrador de Análise (Analysis Orchestrator)</h1>
      <p class="header-desc">Execução encadeada de pipelines de análise, extração de evidências e linha do tempo de incidentes</p>
    </header>

    <div class="card">
      <div class="card-title"><span data-icon="folder"></span> Diretório de Atendimento / Logs</div>
      <div style="display: flex; gap: 8px;">
        <input type="text" id="inputDir" placeholder="Selecione ou cole o caminho da pasta..." style="flex: 1;">
        <button class="btn btn-secondary" onclick="handlePickDir()"><span data-icon="folder"></span> Navegar...</button>
        <button class="btn btn-primary" onclick="handleRun()"><span data-icon="play"></span> Iniciar Orquestração</button>
      </div>
    </div>

    <div class="card" style="flex: 1; overflow-y: auto;">
      <div class="card-title" id="statusTitle"><span data-icon="check"></span> Status da Execução</div>
      <div id="execSteps">
        <div style="color: var(--fg-muted); text-align: center; padding: 16px;">Selecione um diretório para rodar a orquestração.</div>
      </div>
    </div>
  </div>
  <script src="icons.js"></script>
  <script>
    async function handlePickDir() {
      const res = await window.pywebview.api.pick_analysis_dir();
      if (res.success) {
        document.getElementById('inputDir').value = res.path;
      }
    }
    async function handleRun() {
      const dir = document.getElementById('inputDir').value;
      if (!dir) return;
      document.getElementById('execSteps').innerHTML = `<div style="padding: 12px; color: var(--accent);">Executando orquestração em ${dir}...</div>`;
      const res = await window.pywebview.api.run_orchestration(dir, {});
      if (res.success) {
        document.getElementById('statusTitle').innerHTML = `<span data-icon="check"></span> Orquestração Concluída`;
        document.getElementById('execSteps').innerHTML = `
          <div class="exec-step">
            <span>Resultados salvos em: <code>${res.results_dir || res.output_dir || 'concluído'}</code></span>
            <span class="badge badge-success">OK</span>
          </div>
        `;
        if (window.renderIcons) window.renderIcons();
      } else {
        document.getElementById('execSteps').innerHTML = `<div style="color: var(--danger); padding: 12px;">${res.message || 'Erro na orquestração.'}</div>`;
      }
    }
  </script>
</body>
</html>
