<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerador de AFD — Toolbox</title>
  <link rel="stylesheet" href="toolbox-theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1 class="header-title">Gerador de AFD (Portaria 1510/671)</h1>
      <p class="header-desc">Geração de Arquivo Fonte de Dados para testes de importação e auditoria de REP</p>
    </header>

    <div class="card">
      <div class="card-title"><span data-icon="folder"></span> Dados do Empregador e REP</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <input type="text" id="repNumber" placeholder="Nº de Fabricação do REP (17 dígitos)" value="00000000000000001">
        <input type="text" id="cnpj" placeholder="CNPJ do Empregador" value="00000000000191">
        <input type="text" id="razao" placeholder="Razão Social" value="EMPRESA TESTE S/A">
        <input type="text" id="pis" placeholder="PIS do Colaborador" value="12345678901">
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-top: 4px;">
        <div>
          <label style="font-size: 11px; color: var(--fg-muted);">Data Inicial</label>
          <input type="date" id="dtIni" style="width: 100%;">
        </div>
        <div>
          <label style="font-size: 11px; color: var(--fg-muted);">Data Final</label>
          <input type="date" id="dtFim" style="width: 100%;">
        </div>
        <div>
          <label style="font-size: 11px; color: var(--fg-muted);">Horários Padrão</label>
          <input type="text" id="horarios" value="08:00, 12:00, 13:00, 18:00" style="width: 100%;">
        </div>
        <div>
          <label style="font-size: 11px; color: var(--fg-muted);">Variação (min)</label>
          <input type="number" id="variacao" value="2" style="width: 100%;">
        </div>
      </div>
      <div style="display: flex; justify-content: flex-end; margin-top: 4px;">
        <button class="btn btn-primary" onclick="handleGerar()"><span data-icon="zap"></span> Gerar Arquivo AFD</button>
      </div>
    </div>

    <div class="card" style="flex: 1;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="card-title" id="resTitle"><span data-icon="check"></span> Arquivo AFD Gerado</div>
        <button class="btn btn-secondary btn-sm" onclick="handleCopy()"><span data-icon="copy"></span> Copiar AFD</button>
      </div>
      <textarea id="afdOutput" class="afd-textarea" style="flex: 1; height: auto;" readonly></textarea>
    </div>
  </div>
  <script src="icons.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('dtIni').value = today;
      document.getElementById('dtFim').value = today;
    });
    async function handleGerar() {
      const params = {
        rep_number: document.getElementById('repNumber').value,
        cnpj_cpf: document.getElementById('cnpj').value,
        razao_social: document.getElementById('razao').value,
        pis: document.getElementById('pis').value,
        start_date: document.getElementById('dtIni').value,
        end_date: document.getElementById('dtFim').value,
        horarios: document.getElementById('horarios').value.split(',').map(s => s.trim()),
        variacao_minutos: parseInt(document.getElementById('variacao').value) || 0
      };
      const res = await window.pywebview.api.gerar(params);
      if (res.success) {
        document.getElementById('afdOutput').value = res.content;
        document.getElementById('resTitle').innerHTML = `<span data-icon="check"></span> ${res.total_records} registros gerados (${res.filename})`;
        if (window.renderIcons) window.renderIcons();
      }
    }
    async function handleCopy() {
      const txt = document.getElementById('afdOutput').value;
      if (txt) await window.pywebview.api.copy_text(txt);
    }
  </script>
</body>
</html>
