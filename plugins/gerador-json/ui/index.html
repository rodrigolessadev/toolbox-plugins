<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formatador & Validador de JSON — Toolbox</title>
  <link rel="stylesheet" href="toolbox-theme.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header M3 -->
    <header class="header">
      <div class="header-left">
        <span class="plugin-header-icon" data-icon="file-json"></span>
        <h1 class="header-title">Formatador & Validador de JSON</h1>
        <span class="badge badge-accent" id="versionBadge">v1.2.0</span>
        <span class="badge badge-accent">Material 3</span>
      </div>
      <div class="header-right">
        <button type="button" class="btn btn-secondary btn-sm" id="btnThemeToggle" onclick="toggleTheme()" title="Alternar Tema Claro / Escuro">
          <span data-icon="sun" id="themeIcon"></span>
        </button>
      </div>
    </header>

    <!-- Toolbar de Ações e Mock Generator -->
    <div class="toolbar-card">
      <div class="toolbar-group">
        <span class="toolbar-label"><span data-icon="sparkles"></span> Mock:</span>
        <select id="mockSelect" class="select-sm" onchange="handleGenerateMock()">
          <option value="" disabled selected>Gerar Mock...</option>
          <option value="usuario">👤 Objeto Usuário</option>
          <option value="lista_usuarios">👥 Lista de Usuários</option>
          <option value="api_response">🌐 Resposta de API</option>
          <option value="config">⚙️ Configuração</option>
        </select>
        <button type="button" class="btn btn-secondary btn-sm" onclick="handleOpenFile()" title="Abrir arquivo .json local">
          <span data-icon="folder-open"></span> Abrir
        </button>
      </div>

      <div class="toolbar-group">
        <div class="indent-group">
          <span class="toolbar-label">Indentação:</span>
          <select id="indentSelect" class="select-sm">
            <option value="2" selected>2 espaços</option>
            <option value="4">4 espaços</option>
          </select>
        </div>
        <button type="button" class="btn btn-primary btn-sm" onclick="handleFormat()" title="Formatar e identar JSON">
          <span data-icon="check"></span> Formatar
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="handleMinify()" title="Minificar JSON (remover espaços)">
          <span data-icon="zap"></span> Minificar
        </button>
        <button type="button" class="btn btn-secondary btn-sm" id="btnCopy" onclick="handleCopy()" title="Copiar conteúdo">
          <span data-icon="copy"></span> Copiar
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="handleSaveFile()" title="Salvar arquivo JSON no disco">
          <span data-icon="download"></span> Salvar
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="handleClear()" title="Limpar editor">
          <span data-icon="trash-2"></span> Limpar
        </button>
      </div>
    </div>

    <!-- Card Principal do Editor -->
    <div class="card editor-card">
      <div class="editor-header">
        <div class="status-indicator">
          <span id="statusBadge" class="badge badge-muted">Pronto</span>
          <span id="structureInfo" class="structure-text">Nenhum payload carregado</span>
        </div>
        <div class="editor-shortcuts-hint">
          <span>Ctrl+V para colar</span>
        </div>
      </div>

      <div class="textarea-wrapper">
        <textarea id="jsonEditor" class="editor-textarea" placeholder="Cole, digite seu JSON ou selecione um Mock acima..." spellcheck="false"></textarea>
      </div>
    </div>

    <!-- Status Bar Inferior -->
    <footer class="status-bar">
      <div class="status-left">
        <span id="statSize">0 bytes</span>
        <span>•</span>
        <span id="statLines">0 linhas</span>
      </div>
      <div class="status-right">
        <span>Sintaxe JSON RFC 8259</span>
        <span>•</span>
        <span class="badge badge-muted">UTF-8</span>
      </div>
    </footer>
  </div>

  <script src="icons.js"></script>
  <script>
    let currentTheme = 'dark';

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadVersion();
      setupEditorListeners();
      updateStats();
    });

    function initTheme() {
      const saved = localStorage.getItem('toolbox_theme') || 'dark';
      applyTheme(saved);
    }

    function applyTheme(t) {
      currentTheme = t;
      document.documentElement.setAttribute('data-theme', t);
      localStorage.setItem('toolbox_theme', t);
      const icon = document.getElementById('themeIcon');
      if (icon) icon.setAttribute('data-icon', t === 'dark' ? 'sun' : 'moon');
      if (window.renderIcons) window.renderIcons();
    }

    function toggleTheme() {
      applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    }

    async function loadVersion() {
      try {
        if (window.pywebview && window.pywebview.api && window.pywebview.api.get_plugin_version) {
          const res = await window.pywebview.api.get_plugin_version();
          if (res.success && res.version) {
            document.getElementById('versionBadge').textContent = `v${res.version}`;
          }
        }
      } catch (e) {
        console.error(e);
      }
    }

    function setupEditorListeners() {
      const textarea = document.getElementById('jsonEditor');
      textarea.addEventListener('input', () => {
        updateStats();
        validateRealtime();
      });
    }

    function updateStats() {
      const txt = document.getElementById('jsonEditor').value;
      const sizeBytes = new Blob([txt]).size;
      const sizeStr = sizeBytes > 1024 ? `${(sizeBytes / 1024).toFixed(1)} KB` : `${sizeBytes} bytes`;
      const lines = txt ? txt.split(/\r?\n/).length : 0;

      document.getElementById('statSize').textContent = sizeStr;
      document.getElementById('statLines').textContent = `${lines} linhas`;
    }

    let valTimeout = null;
    function validateRealtime() {
      clearTimeout(valTimeout);
      valTimeout = setTimeout(async () => {
        const txt = document.getElementById('jsonEditor').value.trim();
        const badge = document.getElementById('statusBadge');
        const struct = document.getElementById('structureInfo');

        if (!txt) {
          badge.className = 'badge badge-muted';
          badge.textContent = 'Pronto';
          struct.textContent = 'Nenhum payload carregado';
          return;
        }

        try {
          if (window.pywebview && window.pywebview.api && window.pywebview.api.validate_json) {
            const res = await window.pywebview.api.validate_json(txt);
            if (res.valid) {
              badge.className = 'badge badge-success';
              badge.textContent = '✔ JSON Válido';
              struct.textContent = res.stats ? `Estrutura: ${res.stats.type}` : '';
            } else {
              badge.className = 'badge badge-danger';
              badge.textContent = `❌ ${res.message}`;
              struct.textContent = 'Sintaxe Inválida';
            }
          }
        } catch (e) {
          console.error(e);
        }
      }, 300);
    }

    async function handleFormat() {
      const txt = document.getElementById('jsonEditor').value;
      const indent = parseInt(document.getElementById('indentSelect').value) || 2;
      const res = await window.pywebview.api.format_json(txt, indent);
      const st = document.getElementById('statusBadge');
      const struct = document.getElementById('structureInfo');

      if (res.success) {
        document.getElementById('jsonEditor').value = res.result;
        st.className = 'badge badge-success';
        st.textContent = '✔ Formatado com sucesso';
        if (res.stats) struct.textContent = `Estrutura: ${res.stats.type}`;
        updateStats();
      } else {
        st.className = 'badge badge-danger';
        st.textContent = `❌ ${res.message}`;
      }
    }

    async function handleMinify() {
      const txt = document.getElementById('jsonEditor').value;
      const res = await window.pywebview.api.minify_json(txt);
      const st = document.getElementById('statusBadge');
      const struct = document.getElementById('structureInfo');

      if (res.success) {
        document.getElementById('jsonEditor').value = res.result;
        st.className = 'badge badge-success';
        st.textContent = '✔ Minificado com sucesso';
        if (res.stats) struct.textContent = `Estrutura: ${res.stats.type}`;
        updateStats();
      } else {
        st.className = 'badge badge-danger';
        st.textContent = `❌ ${res.message}`;
      }
    }

    async function handleGenerateMock() {
      const select = document.getElementById('mockSelect');
      const val = select.value;
      if (!val) return;

      try {
        const res = await window.pywebview.api.generate_mock(val);
        if (res.success) {
          document.getElementById('jsonEditor').value = res.result;
          const st = document.getElementById('statusBadge');
          st.className = 'badge badge-success';
          st.textContent = `✔ Mock '${val}' gerado`;
          updateStats();
          validateRealtime();
        }
      } catch (e) {
        console.error(e);
      }
      select.value = "";
    }

    async function handleOpenFile() {
      try {
        const res = await window.pywebview.api.abrir_arquivo_dialog();
        if (res.success) {
          document.getElementById('jsonEditor').value = res.content;
          const st = document.getElementById('statusBadge');
          st.className = 'badge badge-success';
          st.textContent = `✔ Arquivo carregado (${res.filename})`;
          updateStats();
          validateRealtime();
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function handleSaveFile() {
      const txt = document.getElementById('jsonEditor').value;
      if (!txt) return;
      try {
        const res = await window.pywebview.api.salvar_arquivo_dialog(txt, "dados.json");
        if (res.success) {
          const st = document.getElementById('statusBadge');
          st.className = 'badge badge-success';
          st.textContent = `✔ Arquivo salvo com sucesso!`;
        }
      } catch (e) {
        console.error(e);
      }
    }

    async function handleCopy() {
      const txt = document.getElementById('jsonEditor').value;
      const btn = document.getElementById('btnCopy');
      if (!txt) return;

      try {
        if (window.pywebview && window.pywebview.api && window.pywebview.api.copy_text) {
          await window.pywebview.api.copy_text(txt);
        } else if (navigator.clipboard) {
          await navigator.clipboard.writeText(txt);
        }
        const orig = btn.innerHTML;
        btn.innerHTML = `<span data-icon="check" style="color:var(--success);"></span> Copiado!`;
        if (window.renderIcons) window.renderIcons();
        setTimeout(() => {
          btn.innerHTML = orig;
          if (window.renderIcons) window.renderIcons();
        }, 1200);
      } catch (e) {
        console.error(e);
      }
    }

    function handleClear() {
      document.getElementById('jsonEditor').value = '';
      updateStats();
      const st = document.getElementById('statusBadge');
      st.className = 'badge badge-muted';
      st.textContent = 'Pronto';
      document.getElementById('structureInfo').textContent = 'Nenhum payload carregado';
    }
  </script>
</body>
</html>
