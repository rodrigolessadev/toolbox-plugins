<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logon AWS & Port Forwarding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Bar M3 -->
  <header class="header">
    <div class="brand">
      <span class="brand-icon">☁️</span>
      <span>Logon AWS & Port Forwarding</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <div id="statusPill" class="status-pill status-disconnected">
        <span class="status-dot"></span>
        <span id="statusText">Desconectado</span>
      </div>
      <button class="btn btn-secondary" style="padding: 4px 10px; font-size: 11px;" onclick="toggleTheme()" id="themeBtn">☀️ Tema</button>
    </div>
  </header>

  <!-- Conteúdo Principal -->
  <main class="main-container">

    <!-- Card: Configurações de Conexão -->
    <div class="card">
      <div class="card-title">⚙️ Parâmetros de Conexão</div>

      <div class="grid-2">
        <div class="form-group">
          <label for="profileInput">Usuário / Profile AWS (<code>--profile</code>)</label>
          <input type="text" id="profileInput" placeholder="ex: rodrigo.lessa" value="rodrigo.lessa">
        </div>

        <div class="form-group">
          <label for="localPortInput">Porta Local (<code>localPortNumber</code>)</label>
          <input type="number" id="localPortInput" placeholder="ex: 42586" value="42586" min="1" max="65535">
        </div>
      </div>

      <div style="background: var(--md-sys-color-surface-container-high); padding: 8px 12px; border-radius: var(--md-sys-shape-corner-sm); font-size: 11px; color: var(--md-sys-color-on-surface-variant); display: flex; justify-content: space-between; align-items: center;">
        <span>📌 <strong>Destino Automático:</strong> <code>SSH Tunneling Instance</code> (Região: <code>sa-east-1</code> | Porta Remota: <code>22</code>)</span>
        <span style="font-size: 10px; color: var(--md-sys-color-outline);" id="portCheckHint">Status atualizado a cada 2s</span>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px;">
        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 11px;">
          <input type="checkbox" id="useInternalWebview" checked>
          <span>Exibir autenticação AWS SSO em janela interna (WebView integrado)</span>
        </label>
      </div>

      <!-- Barra de Ações -->
      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; flex-wrap: wrap;">
        <button class="btn btn-secondary" id="btnCancelSso" style="display: none;" onclick="handleCancelSso()">
          ✖ Cancelar Login
        </button>
        <button class="btn btn-primary" id="btnConnect" onclick="handleConnect()">
          ⚡ Conectar (One-Click)
        </button>
        <button class="btn btn-danger" id="btnDisconnect" onclick="handleDisconnect()" disabled>
          🛑 Desconectar
        </button>
      </div>
    </div>

    <!-- Card: Console de Logs & Saída -->
    <div class="card" style="flex: 1;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div class="card-title">📜 Console & Histórico de Logs</div>
        <div style="display: flex; gap: 6px;">
          <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="handleCopyLogs()">📋 Copiar Logs</button>
          <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 11px;" onclick="handleClearLogs()">🗑 Limpar</button>
        </div>
      </div>

      <div id="consoleLog" class="console-container">
        <div class="console-line">[Pronto] Configure o profile e clique em Conectar para iniciar o túnel SSM.</div>
      </div>
    </div>

  </main>

  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
