<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarefas — Toolbox</title>
  <link rel="stylesheet" href="toolbox-theme.css">
  <link rel="stylesheet" href="markdown-field.css" onerror="this.onerror=null;this.href='../../shared/ui/markdown/markdown-field.css';">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Top Header & Tabs -->
    <header class="app-header">
      <div class="brand-section">
        <span class="brand-icon" data-icon="check-square"></span>
        <span class="brand-title">Tarefas</span>
      </div>

      <div class="header-tabs-container" id="tabsContainer">
        <!-- Tab fixa principal -->
        <div class="tab-item active" id="tabMainBtn" onclick="switchToTab('main')">
          <span data-icon="check-square"></span>
          <span class="tab-title-text">Minhas Tarefas</span>
        </div>
        <!-- Tab fixa Lixeira -->
        <div class="tab-item" id="tabTrashBtn" onclick="switchToTab('trash')" title="Lixeira (itens retidos por até 30 dias)">
          <span data-icon="trash-2"></span>
          <span class="tab-title-text">Lixeira</span>
          <span class="badge-trash-count" id="trashCountBadge" style="display: none;">0</span>
        </div>
        <!-- Abas dinâmicas de tarefas abertas inseridas aqui -->
      </div>

      <div class="header-actions">
        <button type="button" class="btn btn-secondary btn-sm" id="btnThemeToggle" onclick="toggleTheme()" title="Alternar Tema Claro / Escuro">
          <span data-icon="sun" id="themeIcon"></span>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Painel Principal: Lista de Tarefas -->
      <section class="view-pane active" id="paneMain">
        <!-- Toolbar de Filtros e Estatísticas -->
        <div class="tasks-toolbar">
          <div class="filter-group">
            <button type="button" class="filter-btn active" id="filterAllBtn" onclick="setFilter('all')">Todas</button>
            <button type="button" class="filter-btn" id="filterPendingBtn" onclick="setFilter('pending')">Pendentes</button>
            <button type="button" class="filter-btn" id="filterCompletedBtn" onclick="setFilter('completed')">Concluídas</button>
          </div>

          <div class="date-filter-group" id="dateFilterGroup">
            <div class="date-input-wrapper" title="Data inicial (De)">
              <span data-icon="calendar" class="date-input-icon"></span>
              <input type="date" id="dateFilterFrom" class="date-input" onchange="handleDateFilterChange()" />
            </div>
            <span class="date-separator">até</span>
            <div class="date-input-wrapper" title="Data final (Até)">
              <input type="date" id="dateFilterTo" class="date-input" onchange="handleDateFilterChange()" />
            </div>
            <button type="button" class="filter-btn-icon" id="btnResetDateFilter" onclick="resetDateFilter()" title="Redefinir para a janela padrão de 1 mês">
              <span data-icon="refresh"></span>
            </button>
            <button type="button" class="filter-btn date-all-btn" id="btnAllDates" onclick="toggleAllDatesFilter()" title="Alternar para ver todo o período histórico">
              Todas as datas
            </button>
          </div>

          <div class="tasks-stats-text" id="tasksStatsText">0 tarefas</div>
        </div>

        <!-- Lista Rolável de Tarefas -->
        <div class="tasks-scroll-container" id="tasksListContainer">
          <!-- Cards de Tarefas gerados dinamicamente -->
        </div>

        <!-- Dock de Chat (Criação e Edição Rápida) -->
        <div class="chat-dock">
          <div class="chat-edit-banner" id="chatEditBanner">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span data-icon="edit" id="chatEditBannerIcon"></span>
              <span id="chatEditMessage">Editando tarefa...</span>
            </div>
            <button type="button" class="btn btn-secondary btn-sm" id="chatCancelBannerBtn" onclick="handleChatCancel()" title="Cancelar (Esc)">
              <span data-icon="x"></span> Cancelar
            </button>
          </div>
          <div class="chat-input-row">
            <input
              type="text"
              id="chatInput"
              class="chat-input"
              placeholder="Adicionar uma nova tarefa... (Pressione Enter)"
              autocomplete="off"
            />
            <button type="button" id="chatSubmitBtn" class="chat-btn chat-btn-submit" onclick="handleChatSubmit()">
              <span data-icon="send" id="chatSubmitIcon"></span>
              <span id="chatSubmitText">Enviar</span>
            </button>
          </div>
        </div>
      </section>
 
      <!-- Painel Lixeira: Tarefas Excluídas com Retenção Temporária -->
      <section class="view-pane" id="paneTrash">
        <div class="trash-toolbar">
          <div class="trash-info-summary">
            <span data-icon="trash-2" class="trash-info-icon"></span>
            <span>Tarefas na lixeira permanecem retidas por até <strong>30 dias</strong> antes do expurgo permanente.</span>
          </div>
          <div class="trash-actions">
            <button type="button" class="btn btn-secondary btn-sm" id="btnRefreshTrash" onclick="loadTrashTasks(true)" title="Recarregar lixeira">
              <span data-icon="refresh"></span> Atualizar
            </button>
            <button type="button" class="btn btn-danger btn-sm" id="btnEmptyTrash" onclick="handleEmptyTrash()" title="Excluir todas as tarefas da lixeira permanentemente">
              <span data-icon="trash-2"></span> Esvaziar Lixeira
            </button>
          </div>
        </div>

        <div class="tasks-scroll-container" id="trashListContainer">
          <!-- Cards de tarefas excluídas gerados dinamicamente -->
        </div>
      </section>

      <!-- Painéis dinâmicos das Abas Detalhadas de Tarefa -->
      <div id="dynamicPanesContainer" style="height: 100%; width: 100%; display: contents;"></div>
    </main>
  </div>

  <script src="icons.js"></script>
  <script src="markdown-field.js" onerror="this.onerror=null;this.src='../../shared/ui/markdown/markdown-field.js';"></script>
  <script src="app.js"></script>
</body>
</html>
