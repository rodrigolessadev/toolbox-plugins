<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarefas — Toolbox</title>
  <link rel="stylesheet" href="toolbox-theme.css">
  <link rel="stylesheet" href="../../shared/ui/markdown/markdown-field.css" onerror="this.onerror=null;this.href='../shared/ui/markdown/markdown-field.css';">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Top Header & Tabs -->
    <header class="app-header">
      <div class="brand-section">
        <span class="brand-icon" data-icon="check-square"></span>
        <span class="brand-title">Tarefas</span>
        <span id="versionBadge" class="badge badge-accent">v1.0.0</span>
      </div>

      <div class="header-tabs-container" id="tabsContainer">
        <!-- Tab fixa principal -->
        <div class="tab-item active" id="tabMainBtn" onclick="switchToTab('main')">
          <span data-icon="check-square"></span>
          <span class="tab-title-text">Minhas Tarefas</span>
        </div>
        <!-- Abas dinâmicas de tarefas abertas inseridas aqui -->
      </div>

      <div class="header-actions">
        <button type="button" class="btn btn-secondary btn-sm" id="btnThemeToggle" onclick="toggleTheme()" title="Alternar Tema Claro / Escuro">
          <span data-icon="sun" id="themeIcon"></span>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Painel Principal: Lista de Tarefas -->
      <section class="view-pane active" id="paneMain">
        <!-- Toolbar de Filtros e Estatísticas -->
        <div class="tasks-toolbar">
          <div class="filter-group">
            <button type="button" class="filter-btn active" id="filterAllBtn" onclick="setFilter('all')">Todas</button>
            <button type="button" class="filter-btn" id="filterPendingBtn" onclick="setFilter('pending')">Pendentes</button>
            <button type="button" class="filter-btn" id="filterCompletedBtn" onclick="setFilter('completed')">Concluídas</button>
          </div>
          <div class="tasks-stats-text" id="tasksStatsText">0 tarefas</div>
        </div>

        <!-- Lista Rolável de Tarefas -->
        <div class="tasks-scroll-container" id="tasksListContainer">
          <!-- Cards de Tarefas gerados dinamicamente -->
        </div>

        <!-- Dock de Chat (Criação e Edição Rápida) -->
        <div class="chat-dock">
          <div class="chat-edit-banner" id="chatEditBanner">
            <div style="display: flex; align-items: center; gap: 6px;">
              <span data-icon="edit-3"></span>
              <span id="chatEditMessage">Editando tarefa...</span>
            </div>
            <button type="button" class="btn btn-secondary btn-sm" onclick="cancelQuickEdit()" title="Cancelar edição (Esc)">
              <span data-icon="x"></span> Cancelar
            </button>
          </div>
          <div class="chat-input-row">
            <input
              type="text"
              id="chatInput"
              class="chat-input"
              placeholder="Adicionar uma nova tarefa... (Pressione Enter)"
              autocomplete="off"
            />
            <button type="button" id="chatSubmitBtn" class="chat-btn chat-btn-submit" onclick="handleChatSubmit()">
              <span data-icon="send" id="chatSubmitIcon"></span>
              <span id="chatSubmitText">Enviar</span>
            </button>
          </div>
        </div>
      </section>

      <!-- Painéis dinâmicos das Abas Detalhadas de Tarefa -->
      <div id="dynamicPanesContainer" style="height: 100%; width: 100%; display: contents;"></div>
    </main>
  </div>

  <script src="icons.js"></script>
  <script type="module" src="../../shared/ui/markdown/markdown-field.js" onerror="this.onerror=null;this.src='../shared/ui/markdown/markdown-field.js';"></script>
  <script src="app.js"></script>
</body>
</html>
